services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: temporal_proj
      POSTGRES_USER: temporal_proj
      POSTGRES_PASSWORD: temporal_proj
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://temporal_proj:temporal_proj@postgres:5432/temporal_proj
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
