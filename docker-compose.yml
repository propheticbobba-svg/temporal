services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: temporal_proj
      POSTGRES_USER: temporal_proj
      POSTGRES_PASSWORD: temporal_proj
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal_proj -d temporal_proj"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://temporal_proj:temporal_proj@postgres:5432/temporal_proj
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
